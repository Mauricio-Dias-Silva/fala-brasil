<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FalaBrasil | Chat Soberano</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR: LISTA DE CONVERSAS -->
        <aside id="sidebar">
            <header>
                <div class="header-left">
            <div class="header-avatar" style="background-image: url('logo.png');"></div>
                </div>
                <div class="header-actions">
                    <i class="ph ph-users-three"></i>
                    <i class="ph ph-circle-dashed"></i>
                    <i class="ph ph-chat-centered-dots"></i>
                    <i class="ph ph-dots-three-vertical"></i>
                </div>
            </header>

            <div class="search-container" style="padding: 10px 16px; background: var(--bg-deep);">
                <div style="background: #202c33; border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 10px;">
                    <i class="ph ph-magnifying-glass" style="color: var(--text-muted); font-size: 18px;"></i>
                    <input type="text" placeholder="Pesquisar ou começar uma nova conversa" style="background: transparent; border: none; outline: none; color: white; width: 100%; font-size: 14px;">
                </div>
            </div>

            <div class="chat-list-container" id="chat-list">
                <!-- ABA CONVERSAS -->
                <div id="tab-chats">
                    <div class="chat-item" onclick="openChat('Gabinete Presidencial')">
                        <div class="avatar" style="background-image: url('https://i.pravatar.cc/150?u=presidencia'); border: 2px solid var(--national-gold);"></div>
                        <div class="chat-item-info">
                            <div class="chat-item-header">
                                <span class="name">Gabinete Presidencial</span>
                                <span class="time">15:42</span>
                            </div>
                            <div class="chat-item-msg"><i class="ph ph-lock-key" style="font-size: 12px;"></i> Mensagem Criptografada</div>
                        </div>
                    </div>
                </div>

                <!-- ABA STATUS -->
                <div id="tab-status" class="hidden" style="padding: 16px;">
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 24px;">
                        <div class="avatar" style="background-image: url('https://i.pravatar.cc/100?u=me'); position: relative;">
                            <i class="ph-fill ph-plus-circle" style="position: absolute; bottom: 0; right: 0; color: var(--social-green); background: white; border-radius: 50%; font-size: 18px;"></i>
                        </div>
                        <div>
                            <div style="font-weight: 600; color: white;">Meu Status</div>
                            <div style="font-size: 13px; color: var(--text-muted);">Toque para atualizar</div>
                        </div>
                    </div>
                    <div style="color: var(--text-muted); font-size: 12px; font-weight: 700; margin-bottom: 15px;">ATUALIZAÇÕES RECENTES</div>
                    <div class="chat-item">
                        <div class="avatar" style="background-image: url('https://i.pravatar.cc/150?u=aura'); border: 2px solid var(--social-green);"></div>
                        <div>
                            <div style="font-weight: 600; color: white;">Aura Cloud</div>
                            <div style="font-size: 12px; color: var(--text-muted);">Há 10 minutos</div>
                        </div>
                    </div>
                </div>

                <!-- ABA GRUPOS -->
                <div id="tab-groups" class="hidden">
                    <div class="chat-item" style="color: var(--social-green);" onclick="createNewGroup()">
                        <div class="avatar" style="background: rgba(0,245,196,0.1); display: flex; justify-content: center; align-items: center;">
                            <i class="ph ph-users-plus"></i>
                        </div>
                        <div class="name">Criar Grupo Gigante</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CHAT VIEW: MENSAGENS -->
        <main id="chat-view">
            <header>
                <div class="header-left">
                    <i class="ph ph-arrow-left back-btn" onclick="closeChat()"></i>
                    <div id="chat-avatar" class="header-avatar" style="background-image: url('https://i.pravatar.cc/150?u=presidencia');"></div>
                    <div class="header-info">
                        <h2 id="chat-name">Gabinete Presidencial</h2>
                        <span>visto por último hoje às 15:45</span>
                    </div>
                </div>
                <div class="header-actions">
                    <i class="ph ph-video-camera"></i>
                    <i class="ph ph-phone"></i>
                    <i class="ph ph-magnifying-glass"></i>
                    <i class="ph ph-dots-three-vertical"></i>
                </div>
            </header>

            <div id="messages-container">
                <!-- Mensagens do chat aqui -->
            </div>

            <div class="input-area">
                <i class="ph ph-smiley icon-btn"></i>
                <i class="ph ph-plus icon-btn"></i>
                <div class="input-container">
                    <input type="text" id="message-input" placeholder="Mensagem">
                </div>
                <i class="ph-fill ph-currency-circle-dollar icon-btn" style="color: var(--national-gold); margin: 0 10px;" onclick="openJetPay()"></i>
                <i class="ph-fill ph-microphone icon-btn" id="send-btn"></i>
            </div>
        </main>
        
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="showTab('chats')">
                <i class="ph-fill ph-chats-teardrop"></i>
                <span>Conversas</span>
            </div>
            <div class="nav-item" onclick="showTab('status')">
                <i class="ph ph-circle-dashed"></i>
                <span>Status</span>
            </div>
            <div class="nav-item" onclick="showTab('groups')">
                <i class="ph ph-users-three"></i>
                <span>Grupos</span>
            </div>
            <div class="nav-item" onclick="showTab('settings')">
                <i class="ph ph-gear"></i>
                <span>Config</span>
            </div>
        </nav>
    </div>

    <script src="app.js"></script>
    <script>
        function openChat(name) {
            document.getElementById('chat-name').innerText = name;
            document.getElementById('chat-view').classList.add('active');
        }
        function closeChat() {
            document.getElementById('chat-view').classList.remove('active');
        }
        function showTab(tab) {
            document.querySelectorAll('#chat-list > div').forEach(div => div.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
